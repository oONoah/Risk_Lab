[project]
name = "risklab"
version = "0.1.0"
description = "RiskLab research package"
readme = "README.md"
requires-python = ">=3.10"

# Dependencies als Array von Strings (PEP-621)
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "typer>=0.9",
  "yfinance>=0.2",
  "fastparquet>=2024.2.0",
  "pyarrow>=15.0"
]

# Optional / dev dependencies (als Mapping von Gruppen zu Arrays)
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "ruff>=0.12",
  "isort",
  "mypy"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "isort (>=9.0.1,<10.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]
